server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos sob /assets têm hash no nome: mudou o conteúdo, mudou a URL.
    # Podem ser cacheados para sempre sem risco de servir versão velha.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.
    # ⚠️ `no-store` no index é o que faz um deploy novo chegar. Ele é o único
    # arquivo sem hash — é ele que aponta para o bundle. Cacheado, o painel
    # continua carregando a versão anterior mesmo depois do rebuild, que foi
    # como o modo demonstração sobreviveu a uma troca de VITE_USE_MOCK.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
